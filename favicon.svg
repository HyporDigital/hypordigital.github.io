<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Simplified icon for browser tabs: no pebbles, one stratum, a heavier flow line. -->
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7B47"/><stop offset=".5" stop-color="#F0508A"/><stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#161A3A"/>
    <rect y="27" width="64" height="37" fill="#252C5C"/>
    <line x1="0" y1="27" x2="64" y2="27" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="1.4"/>
    <path d="M-3 17 C 16 17, 16 51, 32 51 S 48 17, 67 17" fill="none" stroke="url(#flow)"
          stroke-width="7.5" stroke-linecap="round"/>
  </g>
</svg>
