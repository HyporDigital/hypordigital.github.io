<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- HyporDigital icon, "Exchange": a cross-section of a stream. Water dips from
       the surface into the streambed and comes back up, the hyporheic flow path. -->
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7B47"/><stop offset=".5" stop-color="#F0508A"/><stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1F45"/><stop offset="1" stop-color="#141833"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#water)"/>
    <rect y="214" width="512" height="134" fill="#1E244B"/>
    <rect y="348" width="512" height="164" fill="#283063"/>
    <g fill="#3B4585">
      <circle cx="62" cy="262" r="7"/><circle cx="128" cy="244" r="5"/><circle cx="414" cy="256" r="7"/>
      <circle cx="466" cy="300" r="5"/><circle cx="48" cy="398" r="7"/><circle cx="118" cy="454" r="5"/>
      <circle cx="398" cy="444" r="7"/><circle cx="458" cy="396" r="5"/><circle cx="350" cy="298" r="4.5"/>
      <circle cx="170" cy="318" r="4.5"/><circle cx="260" cy="470" r="5"/>
    </g>
    <line x1="0" y1="214" x2="512" y2="214" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="5"/>
    <path d="M-20 140 C 128 140, 132 408, 256 408 S 384 140, 532 140" fill="none" stroke="url(#flow)"
          stroke-width="56" stroke-linecap="round" opacity=".35" filter="url(#soft)"/>
    <path d="M-20 140 C 128 140, 132 408, 256 408 S 384 140, 532 140" fill="none" stroke="url(#flow)"
          stroke-width="38" stroke-linecap="round"/>
  </g>
</svg>
