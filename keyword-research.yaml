file: keyword-research.html
title: HyporDigital Keyword Research | HyporDigital
description: >-
  HyporDigital Keyword Research is HyporDigital's internal app for keyword research and marketing for the
  businesses we work with.
heading: HyporDigital Keyword Research
lede: >-
  HyporDigital Keyword Research is the internal app our team uses to research keywords and manage marketing for
  the businesses we work with.

sections:

- title: What it does
  body:
  - >-
    The app connects to Google services such as Google Ads, Search Console, Google Analytics and Merchant Center,
    using only the accounts a business has chosen to share with us. We use it for keyword research, reporting
    and running our clients' advertising.

- title: Who uses it
  body:
  - >-
    Only the HyporDigital team. It isn't offered to the public and there's no sign-up.

- title: Privacy
  body:
  - >-
    How the app handles Google user data is described in our
    <a href="privacy.html">privacy policy</a>, including how to remove its access.
    Questions go to <a href="mailto:service@hypordigital.com">service@hypordigital.com</a>.
